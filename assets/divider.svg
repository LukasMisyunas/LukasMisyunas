<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2" preserveAspectRatio="none">
  <rect width="1200" height="1" y="0.5" fill="#FFFFFF" opacity="0.15"/>
  <rect width="200" height="1" y="0.5" fill="#FFFFFF">
    <animate attributeName="x" from="-200" to="1200" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
